# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: env -u npm_config_cache-dir -u NPM_CONFIG_CACHE-DIR -u npm_config_cache_dir -u NPM_CONFIG_CACHE_DIR npm ci --include=optional
    - run: env -u npm_config_cache-dir -u NPM_CONFIG_CACHE-DIR -u npm_config_cache_dir -u NPM_CONFIG_CACHE_DIR npm run build --if-present
    - run: env -u npm_config_cache-dir -u NPM_CONFIG_CACHE-DIR -u npm_config_cache_dir -u NPM_CONFIG_CACHE_DIR npm test
